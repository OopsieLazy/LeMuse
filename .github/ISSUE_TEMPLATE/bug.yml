name: Bug report
description: Something is broken
title: "fix: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Before you paste anything, remove:
        your Are.na token (it never expires; if one leaked, make a new one on Are.na and delete the old),
        your Windows user name (it's in paths like `C:\Users\<name>\…`; LeMuse's Copy details already hides it),
        and links to private channels. Security problems: see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. lemuse sync ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Settings → About shows it; Report a problem fills it in.
  - type: textarea
    id: logs
    attributes:
      label: Logs / sync_runs summary
      description: Remove any tokens, user names and private links before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, my Windows user name and private links from what I pasted.
          required: true
