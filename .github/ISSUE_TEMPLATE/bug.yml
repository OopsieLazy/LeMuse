name: Bug report
description: Something is broken
title: "fix: "
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. lemuse sync ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs / sync_runs summary
      description: Remove any tokens before pasting.
      render: text
