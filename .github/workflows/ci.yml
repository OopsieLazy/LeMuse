name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job's GITHUB_TOKEN; jobs that need more say so
# (review 0005 A-21). Third-party actions are pinned to full commit SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The PR-title check lives in pr-title.yml so it also re-runs when a title is
# edited, without re-running this whole workflow (review 0011).

jobs:
  security:
    # Security is the first gate (ADR-0011): secrets, then vulnerable dependencies.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Secret + personal-data scan (repo scanner)
        run: node scripts/scan-secrets.mjs --all
      # The gitleaks binary itself, not gitleaks-action: the action computed
      # "<first commit>^..HEAD" on the first push of main and scanned nothing
      # (review 0011 A-52). Pinned version, checked against the checksum
      # published with that release; scans every commit of the full clone.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSLf -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 .
      - name: npm audit (high and above fails; reviewed, expiring exceptions only)
        run: npm ci --ignore-scripts --prefix app && node scripts/npm-audit-gate.mjs app
      - name: cargo audit (RustSec advisories)
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Dependency review (new deps in this PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core + CLI)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Install scripts off: the 2026 npm worms spread through install hooks
      # (review 0008). Nothing here needs them; W3C uses the runner's Java.
      - run: npm ci --ignore-scripts
      - name: Typecheck UI
        run: npm run typecheck
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build UI + W3C validation (Nu HTML Checker, ADR-0009)
        run: npm run validate:w3c
      - name: Layout test (headless Edge, ADR-0012)
        run: node scripts/layout-test.mjs
      - name: Clippy (Tauri shell)
        working-directory: .
        run: cargo clippy -p lemuse-app -- -D warnings

  test-build:
    # A downloadable Windows test build on every PR, so the owner can run the
    # real app without a toolchain (ADR-0009). Unsigned; for review only.
    if: github.event_name == 'pull_request'
    needs: [app, security]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Install scripts off: the 2026 npm worms spread through install hooks
      # (review 0008). Nothing here needs them; W3C uses the runner's Java.
      - run: npm ci --ignore-scripts
        working-directory: app
      - name: Build installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - name: Installer size budget (keep it slim, ADR-0011)
        shell: pwsh
        run: |
          $f = Get-Item target/release/bundle/nsis/*.exe
          $mb = [math]::Round($f.Length / 1MB, 2)
          Write-Host "installer: $mb MiB (budget 10 MiB)"
          if ($f.Length -gt 10MB) { throw "Installer is $mb MiB, over the 10 MiB budget" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lemuse-test-build-${{ github.event.pull_request.number }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
