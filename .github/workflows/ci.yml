name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job's GITHUB_TOKEN; jobs that need more say so
# (review 0005 A-21). Third-party actions are pinned to full commit SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, so lint it (ADR-0006).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    # Security is the first gate (ADR-0011): secrets, then vulnerable dependencies.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Secret + personal-data scan (repo scanner)
        run: node scripts/scan-secrets.mjs --all
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit (high and above fails)
        working-directory: app
        run: npm ci --ignore-scripts && npm audit --audit-level=high
      - name: cargo audit (RustSec advisories)
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Dependency review (new deps in this PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core + CLI)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - name: Typecheck UI
        run: npm run typecheck
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build UI + W3C validation (Nu HTML Checker, ADR-0009)
        run: npm run validate:w3c
      - name: Layout test (headless Edge, ADR-0012)
        run: node scripts/layout-test.mjs
      - name: Clippy (Tauri shell)
        working-directory: .
        run: cargo clippy -p lemuse-app -- -D warnings

  test-build:
    # A downloadable Windows test build on every PR, so the owner can run the
    # real app without a toolchain (ADR-0009). Unsigned; for review only.
    if: github.event_name == 'pull_request'
    needs: [app, security]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
        working-directory: app
      - name: Build installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - name: Installer size budget (keep it slim, ADR-0011)
        shell: pwsh
        run: |
          $f = Get-Item target/release/bundle/nsis/*.exe
          $mb = [math]::Round($f.Length / 1MB, 2)
          Write-Host "installer: $mb MiB (budget 10 MiB)"
          if ($f.Length -gt 10MB) { throw "Installer is $mb MiB, over the 10 MiB budget" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lemuse-test-build-${{ github.event.pull_request.number }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
