name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, so lint it (ADR-0006).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core + CLI)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Typecheck UI
        run: npm run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build UI + W3C validation (Nu HTML Checker, ADR-0009)
        run: npm run validate:w3c
      - name: Clippy (Tauri shell)
        working-directory: .
        run: cargo clippy -p servensurf-app -- -D warnings

  test-build:
    # A downloadable Windows test build on every PR, so the owner can run the
    # real app without a toolchain (ADR-0009). Unsigned; for review only.
    if: github.event_name == 'pull_request'
    needs: app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - name: Build installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: servensurf-test-build-${{ github.event.pull_request.number }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
