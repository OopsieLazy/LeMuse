# Guardrail gate (owner, session 19; ADR-0030). A pull request that changes a
# guardrail file (CI, hooks, scanner rules, ignore lists, app permissions, the
# CSP, CLAUDE.md…) fails this check until the owner reads those files and adds
# the "guardrails-reviewed" label. Only people with write access can label, so
# a change can't approve itself. Its own workflow so labelling re-runs it fast.
name: guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guardrail files need the owner's label
        env:
          GUARDRAIL_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/guardrail-check.mjs --range "origin/${BASE_REF}...HEAD"
