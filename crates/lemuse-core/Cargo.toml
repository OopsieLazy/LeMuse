[package]
name = "lemuse-core"
description = "Sync engine, connectors and local library store for lemuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
rusqlite.workspace = true
ureq.workspace = true
# Uniquely named temp file + atomic replace for lemuse.toml edits (review 0008 A-32).
tempfile.workspace = true
toml_edit.workspace = true
url.workspace = true
getrandom.workspace = true

# Windows Credential Manager for the Are.na token, and console echo off while
# it's pasted (ADR-0023). Same windows-sys 0.61.2 already in Cargo.lock (Tauri,
# rustls); only features are turned on, so no new crate is downloaded.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Console",
] }

[dev-dependencies]
