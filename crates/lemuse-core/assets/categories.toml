# LeMuse category vocabulary (ADR-0015).
#
# Are.na has no tags or genres: a block only says what *type* it is (image,
# link, attachment, embed, text). LeMuse sorts images into these categories
# itself, from the block's title and description, the museum's object type,
# and the names of the channels or searches it came from.
#
# Rules for editing:
# - `id` is lower-case letters, digits and `-`; it is stored in the catalog,
#   so renaming an id drops the old category (they are rebuilt on launch).
# - `terms` are whole words or short phrases, written in the singular; a
#   plural "s"/"es" on the matched text is understood. Phrases match words in
#   order ("art deco"). Avoid words with a common second meaning ("light",
#   "screen", "card", "figure") — they mislabel too much.
# - `kinds` matches the Are.na block type instead of words.
# - Changing this file re-sorts every image the next time LeMuse starts.

[[group]]
id = "kind"
label = "Kind"

[[group.category]]
id = "image"
label = "Image"
kinds = ["image"]

[[group.category]]
id = "web-page"
label = "Web page"
kinds = ["link"]

[[group.category]]
id = "document"
label = "Document / file"
kinds = ["attachment"]

[[group.category]]
id = "video-embed"
label = "Video & embed"
kinds = ["embed"]

[[group.category]]
id = "text"
label = "Text"
