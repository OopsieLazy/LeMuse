# ── Your topics (owner's list, Q8 — 2026-11-16) ─────────────────────────────
# Two kinds of source feed each topic (ADR-0008):
#   • cleveland — free museum keyword search (Cleveland Museum of Art Open
#     Access). Uses the topic's `keywords`; CC0 images only. Refreshed weekly.
#     (`aic` — Art Institute of Chicago — is built but left out until its image
#     host is verified inside the app window; see review 0002 D-18. To try it,
#     add a `[[topic.source]]` with `source = "aic"` to any topic.)
#   • arena — Are.na channels (free plan: no keyword search, so channels are
#     picked by hand). Refreshed every launch. All channels below were checked
#     on 2026-11-16 and are public; they're curated by other Are.na users.
#   Some channels were added on request (Q11, 2026-11-17): each name was
#   looked up once with GET /v3/channels/<slug> (no search). If one isn't the
#   channel you meant, replace its slug with the one from its URL.
# Add your own: paste the last part of a channel URL as `channel`.

