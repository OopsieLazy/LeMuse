[workspace]
resolver = "2"
members = [
    "crates/lemuse-core",
    "crates/lemuse-cli",
    "app/src-tauri",
]
# The Tauri shell needs the UI toolchain (Node) and is built via `npm run tauri`.
# Plain `cargo build` / `cargo test` cover the core and CLI only.
default-members = [
    "crates/lemuse-core",
    "crates/lemuse-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
lemuse-core = { path = "crates/lemuse-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# Blocking HTTP with rustls (no OpenSSL on Windows); see ADR-0003.
ureq = "2.12"
