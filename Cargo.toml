[workspace]
resolver = "2"
members = [
    "crates/lemuse-core",
    "crates/lemuse-cli",
    "app/src-tauri",
]
# The Tauri shell needs the UI toolchain (Node) and is built via `npm run tauri`.
# Plain `cargo build` / `cargo test` cover the core and CLI only.
default-members = [
    "crates/lemuse-core",
    "crates/lemuse-cli",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
lemuse-core = { path = "crates/lemuse-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
# 0.41 bundles SQLite 3.54 (RUSTSEC-2026-0459; FTS5 CVE-2026-11822/11824). Review 0008.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Edits lemuse.toml structurally (Add channel), so user input is never spliced into TOML text.
toml_edit = "0.22"
# Strict parsing of pasted Are.na links (host, port, userinfo checks).
url = "2"
# OS randomness for the dashboard token (lemuse serve, ADR-0019). Already locked via rustls/ring.
getrandom = "0.2.17"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# Blocking HTTP with rustls (no OpenSSL on Windows); see ADR-0003.
ureq = "2.12"
