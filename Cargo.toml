[workspace]
resolver = "2"
members = [
    "crates/servensurf-core",
    "crates/servensurf-cli",
    "app/src-tauri",
]
# The Tauri shell needs the UI toolchain (Node) and is built via `npm run tauri`.
# Plain `cargo build` / `cargo test` cover the core and CLI only.
default-members = [
    "crates/servensurf-core",
    "crates/servensurf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
servensurf-core = { path = "crates/servensurf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
